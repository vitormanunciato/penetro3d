# Testa o código, monta o instalador Windows, instala de verdade num Windows limpo
# e — só quando o push é uma tag vX.Y.Z — publica a versão. O programa instalado
# nos computadores consulta essa página de versões e oferece a atualização.
#
# Para lançar uma versão nova:
#   1. mude VERSAO em app/penetro3d_versao.py
#   2. git commit, depois:  git tag -a v1.4.0 -m "o que mudou"  &&  git push --follow-tags
#   O texto da tag vira as notas da versão (o "O que mudou" dentro do programa).
name: Instalador

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest testes -q

  construir:
    needs: testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ferramentas (msitools, NSIS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools nsis
      - name: Tag e versão do programa precisam bater
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'app'); import penetro3d_versao as m; print(m.VERSAO)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::A tag é ${GITHUB_REF_NAME}, mas app/penetro3d_versao.py diz $v"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: win-${{ hashFiles('requirements-win.txt', 'instalador/construir_windows.sh') }}
      - name: Montar o instalador
        run: PY_HOST="$(command -v python)" instalador/construir_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/Penetro3D-Setup.exe
          retention-days: 14

  testar-no-windows:
    needs: construir
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # caminho com espaço e acento, de propósito
      DESTINO: ${{ github.workspace }}\Programas de Teste\Penetro3D Ação
      PENETRO3D_SEM_ATUALIZACAO: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador
      - name: Instalar sem perguntas
        run: |
          $p = Start-Process .\Penetro3D-Setup.exe -ArgumentList '/S', "/D=$env:DESTINO" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalador saiu com $($p.ExitCode)" }
          Get-ChildItem $env:DESTINO
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Penetro3D.lnk")) { throw 'sem atalho no menu Iniciar' }
      - name: Bibliotecas e janela (tkinter)
        run: |
          & "$env:DESTINO\python\python.exe" -E -s -c @'
          import sys, tkinter, numpy, pandas, matplotlib, shapely, pyproj, reportlab, qrcode, contourpy, kiwisolver, openpyxl
          print(sys.version)
          r = tkinter.Tk(); r.after(400, r.destroy); r.mainloop()
          print("tk", tkinter.TkVersion, "ok")
          '@
          if ($LASTEXITCODE -ne 0) { throw 'falhou ao importar' }
      - name: Gerar relatórios do exemplo
        run: |
          $saida = Join-Path $env:RUNNER_TEMP 'saída teste'
          & "$env:DESTINO\python\python.exe" -E -s "$env:DESTINO\app\penetro3d_app.py" --cli `
              --projeto "Fazenda Exemplo" `
              --kml "$env:DESTINO\exemplos\talhoes_exemplo.kml" `
              --xlsx "$env:DESTINO\exemplos\penetrometria_exemplo.xlsx" `
              --saida $saida
          if ($LASTEXITCODE -ne 0) { throw 'processamento falhou' }
          foreach ($t in 'Talhao_Norte', 'Talhao_Sul') {
            $html = Get-Item "$saida\Fazenda_Exemplo\$t\$t.html"
            $pdf  = Get-Item "$saida\Fazenda_Exemplo\$t\$t.pdf"
            "{0}: html {1:N0} B · pdf {2:N0} B" -f $t, $html.Length, $pdf.Length
            if ($html.Length -lt 4000000) { throw "$t.html sem o plotly.js embutido" }
            if ($pdf.Length -lt 100000)   { throw "$t.pdf pequeno demais" }
          }
      - name: Planejamento de coleta
        run: |
          & "$env:DESTINO\python\python.exe" -E -s "$env:DESTINO\app\penetro3d_app.py" --plano `
              --kml "$env:DESTINO\exemplos\talhoes_exemplo.kml" --saida (Join-Path $env:RUNNER_TEMP 'plano')
          if ($LASTEXITCODE -ne 0) { throw 'planejamento falhou' }
      - name: Instalar por cima (atualização)
        run: |
          $p = Start-Process .\Penetro3D-Setup.exe -ArgumentList '/S', "/D=$env:DESTINO" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstalação saiu com $($p.ExitCode)" }
          & "$env:DESTINO\python\python.exe" -E -s "$env:DESTINO\app\penetro3d_app.py" --versao
      - name: Desinstalar
        run: |
          $p = Start-Process "$env:DESTINO\Desinstalar.exe" -ArgumentList '/S', "_?=$env:DESTINO" -Wait -PassThru
          if (Test-Path "$env:DESTINO\python") { throw 'desinstalação deixou o Python para trás' }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Penetro3D.lnk") { throw 'atalho ficou' }

  publicar:
    needs: testar-no-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: instalador
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notas.md
          [ -s notas.md ] || echo "Penetro3D ${GITHUB_REF_NAME#v}" > notas.md
          cat >> notas.md <<'EOF'

          ---
          **Instalar:** baixe `Penetro3D-Setup.exe` abaixo e abra. Não precisa de senha de administrador.
          O Windows pode mostrar "O Windows protegeu o computador" — clique em *Mais informações* → *Executar assim mesmo*.
          Quem já tem o programa recebe o aviso de atualização sozinho.
          EOF
          gh release create "$GITHUB_REF_NAME" Penetro3D-Setup.exe \
            --title "Penetro3D ${GITHUB_REF_NAME#v}" --notes-file notas.md
